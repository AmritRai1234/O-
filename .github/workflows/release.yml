name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: build + checksum (Safety #2: verifiable artifacts, no curl|sh)
        run: |
          make build
          cd bin && sha256sum o+ > o+.sha256
      - name: attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/o+
            bin/o+.sha256
